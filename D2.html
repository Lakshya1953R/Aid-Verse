<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donor Dashboard | AidVerse</title>
  <link rel="stylesheet" href="style.css" />
  <style>
  body {
    font-family: "Poppins", sans-serif;
    background: #f7f9f7;
    margin: 0;
    padding: 0;
  }

  header {
    background: linear-gradient(135deg, #2e7d32, #388e3c);
    color: white;
    text-align: center;
    padding: 25px;
    border-bottom: 4px solid #1b5e20;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  h1 {
    margin: 0;
    font-size: 2rem;
    font-weight: 700;
  }

  header p {
    margin: 5px 0 0;
    font-size: 1rem;
    color: #f1f8e9;
  }

  .ngo-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin: 40px auto;
    gap: 25px;
    width: 90%;
    max-width: 1100px;
  }

  .ngo-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    width: 300px;
    padding: 20px;
    text-align: center;
    transition: all 0.3s ease;
    cursor: pointer;
    border-top: 6px solid #2e7d32;
  }

  .ngo-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    border-top-color: #f9a825;
  }

  .ngo-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 12px;
  }

  .ngo-card h3 {
    margin: 12px 0 6px;
    color: #1b5e20;
    font-size: 1.1rem;
    font-weight: 600;
  }

  .ngo-card p {
    color: #444;
    font-size: 0.9rem;
  }

  .ngo-card {
    opacity: 0;
    transform: translateY(15px);
    animation: fadeIn 0.8s ease forwards;
  }

  @keyframes fadeIn {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>

</head>
<body>
  <header>
    <h1>Welcome, Donor!</h1>
    <p>Choose an NGO to support</p>
  </header>

  <section class="ngo-list">
    <div class="ngo-card" onclick="openNGO('helpinghands')">
      <img src="logo1.png" alt="Helping Hands NGO">
      <h3>Helping Hands Foundation</h3>
      <p>Requesting funds for flood relief in Assam</p>
    </div>

    <div class="ngo-card" onclick="openNGO('careconnect')">
      <img src="logo2.png" alt="Care Connect">
      <h3>Care Connect</h3>
      <p>Need donations for education supplies in Bihar</p>
    </div>

    <div class="ngo-card" onclick="openNGO('greenfuture')">
      <img src="logo3.png" alt="Green Future">
      <h3>Green Future Trust</h3>
      <p>Raising funds for tree plantation drive</p>
    </div>
  </section>

  <script>
    const userRole = localStorage.getItem('role');
    if (userRole !== 'Donor') {
      window.location.href = 'R_donor.html';
    }

    function openNGO(ngoId) {
      localStorage.setItem('selectedNGO', ngoId);
      window.location.href = 'N2view.html';
    }
  </script>
</body>
</html>
