<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AidVerse | NGO Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #F9A825, #F57F17);
      background-attachment: fixed;
      color: #333;
    }

    .container {
      background: rgba(255, 255, 255, 0.97);
      padding: 40px 30px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      width: 90%;
      max-width: 400px;
      text-align: center;
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      color: #4E342E;
      margin-bottom: 20px;
      font-size: 1.8rem;
      font-weight: 600;
    }

    input {
      width: 85%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #FFD54F;
      border-radius: 8px;
      font-size: 1rem;
      transition: 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: #F9A825;
      box-shadow: 0 0 6px rgba(249,168,37,0.4);
    }

    button {
      background: linear-gradient(135deg, #FBC02D, #F9A825);
      color: #333;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      margin: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    button:hover {
      background: linear-gradient(135deg, #F57F17, #F9A825);
      transform: translateY(-2px);
    }

    footer {
      position: absolute;
      bottom: 15px;
      font-size: 0.8rem;
      color: #4E342E;
      text-align: center;
      width: 100%;
    }

    @media (max-width: 600px) {
      .container {
        width: 90%;
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🌻 NGO Login / Register</h2>

    <form id="ngoForm">
      <input type="text" id="ngoName" placeholder="NGO Name" required><br>
      <input type="email" id="ngoEmail" placeholder="Email" required><br>
      <input type="password" id="ngoPassword" placeholder="Password" required><br>
      <button type="button" onclick="registerNGO()">Register</button>
      <button type="button" onclick="loginNGO()">Login</button>
    </form>
  </div>

  <footer>ConnectHub © 2025 | Working Together for Change</footer>

  <script>
    function registerNGO() {
      const ngoName = document.getElementById("ngoName").value;
      const ngoEmail = document.getElementById("ngoEmail").value;
      const ngoPassword = document.getElementById("ngoPassword").value;

      if (ngoName && ngoEmail && ngoPassword) {
        localStorage.setItem("role", "NGO");
        localStorage.setItem("ngoEmail", ngoEmail);
        alert("NGO Registered Successfully!");
        window.location.href = "N2.html";
      } else {
        alert("Please fill all NGO details");
      }
    }

    function loginNGO() {
      const storedRole = localStorage.getItem("role");
      if (storedRole === "NGO") {
        alert("NGO Login Successful!");
        window.location.href = "N2.html";
      } else {
        alert("User not registered or invalid credentials!");
      }
    }
  </script>
</body>
</html>
