<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donor Dashboard | ConnectHub</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f8f9fb;
      margin: 0;
      padding: 0;
    }

    header {
      background: #0077b6;
      color: white;
      text-align: center;
      padding: 20px;
      border-bottom: 4px solid #023e8a;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    .ngo-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 40px auto;
      gap: 20px;
      width: 90%;
      max-width: 1100px;
    }

    .ngo-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      width: 300px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .ngo-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    }

    .ngo-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
    }

    .ngo-card h3 {
      margin: 10px 0 5px;
      color: #023e8a;
    }

    .ngo-card p {
      color: #333;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome, Donor!</h1>
    <p>Choose an NGO to support</p>
  </header>

  <section class="ngo-list">
    
    <div class="ngo-card" onclick="openNGO('helpinghands')">
      <img src="https://via.placeholder.com/300x180" alt="Helping Hands NGO">
      <h3>Helping Hands Foundation</h3>
      <p>Requesting funds for flood relief in Assam</p>
    </div>

    <div class="ngo-card" onclick="openNGO('careconnect')">
      <img src="https://via.placeholder.com/300x180" alt="Care Connect">
      <h3>Care Connect</h3>
      <p>Need donations for education supplies in Bihar</p>
    </div>

    <div class="ngo-card" onclick="openNGO('greenfuture')">
      <img src="https://via.placeholder.com/300x180" alt="Green Future">
      <h3>Green Future Trust</h3>
      <p>Raising funds for tree plantation drive</p>
    </div>
  </section>

  <script>
    
    const userRole = localStorage.getItem('role');
    if (userRole !== 'Donor') {
      window.location.href = 'R_donor.html';
    }

    
    function openNGO(ngoId) {
      localStorage.setItem('selectedNGO', ngoId);
      window.location.href = 'N2view.html';
    }
  </script>
</body>
</html>
